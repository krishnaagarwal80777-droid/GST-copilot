services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gst_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-gst_copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/001-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gst_copilot} -d ${POSTGRES_DB:-gst_copilot}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: