[project]
name = "gst-copilot"
version = "0.1.0"
description = "Citation-grounded GST assistant"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pypdf>=3.0",
    "pyyaml>=6.0",
    "truststore>=0.9",
    # retrieval (Phase 3)
    "bm25s==0.2.10",
    "lancedb==0.21.2",
    "numpy>=1.26",
    "pandas>=2.2",  # required by lancedb 0.21 when creating tables
    "sentence-transformers==3.4.1",
    "torch==2.6.0",
]

[project.optional-dependencies]
# pgvector backend for retrieval/store.py when `docker compose up -d` is available.
pgvector = ["psycopg[binary]>=3.1"]
# HTTP API (api/) and Streamlit UI (ui/).
api = ["fastapi>=0.115", "uvicorn>=0.30"]
ui = ["streamlit>=1.40"]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]